# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "master", "v1", "release" ]
    tags: ['*']
  pull_request:
    branches: [ "master", "v1", "release" ]

jobs:
  build-21:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3.5.0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle Wrapper
        run: ./gradlew shadowJar

      - name: Upload JarFile
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: ./build/libs/VRCVideoLogViewer-1.0-SNAPSHOT-all.jar

  build-24:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3.5.0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle Wrapper
        run: ./gradlew shadowJar

  release:
    needs: [build-21, build-24]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download JarFile
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@v4
        with:
          name: jar

      - name: Create Release Package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          wget https://r2.7mi.site/vrc/start_v0.6.x.bat
          wget https://r2.7mi.site/vrc/start_v0.6.x_forLinux.sh
          mv ./start_v0.6.x.bat start.bat
          mv ./start_v0.6.x_forLinux.sh start_forLinux.sh
          zip VRCVideoLogViewer.zip VRCVideoLogViewer-1.0-SNAPSHOT-all.jar start.bat start_forLinux.sh
        shell: bash

      - name: Linux Bash Setup Test
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          chmod +x ./start_forLinux.sh
          screen -UAmdS test ./start_forLinux.sh
          sleep 15s
          if [ -d ./tools ]; then
            echo "Tools Folder OK"
            if [ -d ./tools/jdk-21.0.2 ]; then
              echo "OpenJDK OK"
              if [ -d ./tools/javafx-sdk-21.0.9 ]; then
                echo "JavaFX OK"
                if [ -d ./tools/ImageMagick ]; then
                  echo "ImageMagick OK"
                else
                  exit 1
                fi
              else
                exit 1
              fi
            fi
          else
            exit 1
          fi

        shell: bash

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        id: create_release
        uses: actions/create-release@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: v${{ github.ref }}
          body: |
            - Linux環境で動作しない問題修正
            - 詳細画面 開くボタン追加
          draft: false
          prerelease: true

      - name: Upload JarFile
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./VRCVideoLogViewer.zip
          asset_name: VRCVideoLogViewer.zip
          asset_content_type: application/java-archive

      - name: Delete File
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            jar